# Chunk 2.7 — Go strangler upstream. Lives at http{} level
# (must be outside server{} per nginx grammar). Referenced from
# includes/strangler.conf via `proxy_pass http://jms_go`.
#
# 2026-07-01 cutover: Go now binds host:8080 (was :8089 pre-cutover
# when Python owned :8080). Sidecars (koko/lion/chen) point at
# host.docker.internal:8080 via their CORE_HOST env; the strangler
# routes here point at the same address so browser + sidecar
# traffic converge on the same jms-api process.
#
# Retry tolerance: max_fails=5 fail_timeout=3s. Chosen so a rolling
# jms-api restart (kill + <2s downtime + start) does not strand
# active browser requests — nginx retries the upstream up to 5
# times within a 3-second window before marking it dead. Older
# max_fails=2 fail_timeout=10s produced a 10s cooldown after any
# quick restart which surfaced as 502 to the user.
upstream jms_go {
    server host.docker.internal:8080 max_fails=5 fail_timeout=3s;
    keepalive 32;
}
