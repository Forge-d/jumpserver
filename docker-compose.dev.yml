# Unified project name — the three grydd-pam compose stacks (this one +
# grydd-pam-connectors/deploy/connector + grydd-pam-core) all share
# `name: grydd-pam` so Docker Desktop groups them together. Container
# names stay unchanged (they are pinned via container_name: on each
# service).
name: grydd-pam

services:

  db:
    image: postgres:15-alpine
    container_name: jms_db
    restart: always
    environment:
      POSTGRES_DB: jumpserver
      POSTGRES_USER: jumpserver
      POSTGRES_PASSWORD: jms_dev_pass_2024
    ports:
      - "5433:5432"
    volumes:
      - jms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jumpserver"]
      interval: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: jms_redis
    restart: always
    command: redis-server --requirepass redis_dev_pass_2024
    ports:
      - "6379:6379"


  # OpenBao — external secret-store used by BOTH the Python
  # JumpServer (this compose) AND the Go grydd-pam-core service
  # (../grydd-pam-core/docker-compose.yml runs its own
  # grydd-pam-openbao container — start whichever you need).
  #
  # If you want a single OpenBao shared across both stacks,
  # comment this block out and run the Go-side compose; both
  # stacks talk to 127.0.0.1:8200 from the host.
  #
  # For the Python gunicorn running ON THE HOST, set in your
  # config.yml or env:
  #   VAULT_ENABLED:        true
  #   VAULT_BACKEND:        hcp
  #   VAULT_HCP_HOST:       http://127.0.0.1:8200
  #   VAULT_HCP_TOKEN:      dev-root-token-not-for-prod
  #   VAULT_HCP_MOUNT_POINT: jumpserver
  #
  # The Go service's chunk-8-vault wiring uses the SAME defaults
  # so secrets written by either stack are readable on the other.
  openbao:
    image: ghcr.io/openbao/openbao:latest
    container_name: jms_openbao
    restart: always
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root-token-not-for-prod
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_LOG_LEVEL: info
    command:
      - server
      - -dev
      - -dev-root-token-id=dev-root-token-not-for-prod
      - -dev-listen-address=0.0.0.0:8200
    ports:
      - "8200:8200"
    profiles:
      # Opt-in: only start when the operator passes
      # `--profile vault`. Avoids port-collision with the
      # Go-side compose if both are running.
      - vault

  # koko + lion — RETIRED, replaced by grydd-terminal + grydd-graphical
  # from grydd-pam-connectors. Kept behind the `legacy` profile so a
  # regular `docker compose up -d` no longer starts them and doesn't
  # collide on host :2222 / :8081 with the new connectors. Bring back
  # with `--profile legacy` if you specifically need the Python images.
  koko:
    image: jumpserver/koko:v4.10.16-ce
    container_name: jms_koko
    profiles: [legacy]
    restart: always
    privileged: true
    environment:
      CORE_HOST: "http://host.docker.internal:8080"
      BOOTSTRAP_TOKEN: "ChangeMeToA24CharToken123456"
      LOG_LEVEL: DEBUG
    ports:
      - "2222:2222"
      - "5050:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lion:
    image: jumpserver/lion:v4.10.16-ce
    container_name: jms_lion
    profiles: [legacy]
    restart: always
    environment:
      CORE_HOST: "http://host.docker.internal:8080"
      BOOTSTRAP_TOKEN: "ChangeMeToA24CharToken123456"
      LOG_LEVEL: DEBUG
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  chen:
    image: jumpserver/chen:v4.10.16-ce
    container_name: jms_chen
    restart: always
    environment:
      CORE_HOST: "http://host.docker.internal:8080"
      BOOTSTRAP_TOKEN: "ChangeMeToA24CharToken123456"
      LOG_LEVEL: DEBUG
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"


  web:
    image: jumpserver/web:v4.10.16-ce
    container_name: jms_web
    restart: always
    environment:
      CORE_HOST: "http://host.docker.internal:8080"
    ports:
      - "80:80"
    volumes:
      # Bind-mount the host's data dir so jms_web's nginx and the on-host
      # gunicorn (writing replays to ./data/media) see the same files.
      - ./data:/opt/jumpserver/data
      - ./web-override.conf:/etc/nginx/conf.d/default.conf:ro
      # Chunk 2.7 / cutover: `upstream jms_go { ... }` points at the
      # host-side Go binary. Overrides the http{}-level upstream stanza
      # baked into the jms_web image (which pointed at :8089 pre-
      # cutover). See docs/migration/99-cutover.md.
      - ./strangler-upstream.conf:/etc/nginx/conf.d/strangler-upstream.conf:ro
      # koko/lion nginx-include overrides — post-cutover these route to
      # grydd-terminal + grydd-graphical (from grydd-pam-connectors) instead
      # of the retired koko/lion containers. The image baked in
      # upstream=koko:5000 / lion:8081 which now fail; these bind-mounts
      # keep the /koko/ and /lion/ URL paths working across recreates.
      - ./nginx-includes/koko.conf:/etc/nginx/includes/koko.conf:ro
      - ./nginx-includes/lion.conf:/etc/nginx/includes/lion.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"


  core:
    image: nginx:alpine
    container_name: jms_core_proxy
    restart: always
    volumes:
      - ./core-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"


volumes:
  # Pre-cutover Postgres data lives at `jumpserver_jms_pg_data` — the
  # volume created when this compose was still project=jumpserver. The
  # cutover renamed the project to grydd-pam which would otherwise create
  # a fresh empty `grydd-pam_jms_pg_data` and lose every terminal
  # registration, ticket flow, and access key. Pin the old volume by name
  # so the Postgres cluster + all schemas survive the project rename.
  jms_pg_data:
    external: true
    name: jumpserver_jms_pg_data
  jms_data:
    external: true
    name: jumpserver_jms_data

# No explicit `networks:` block — every service in every stack shares
# `name: grydd-pam` (this compose + ../grydd-pam-connectors/deploy/connector +
# ../grydd-pam-core), so they all attach to the same implicit
# `grydd-pam_default` bridge network. Container-to-container name
# resolution works across the entire stack out of the box.