server {
    listen 80;
    client_max_body_size 5000m;

    location ~* ^/WW_verify_[^.]+\.txt$ {
        root /opt/jumpserver/data/;
    }

    location /.well-known/ {
        root /opt/jumpserver/data/;
    }

    location = /robots.txt {
        default_type text/html;
        add_header Content-Type "text/plain; charset=UTF-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /web/health/ {
        access_log off;
        add_header Content-Type 'application/json';
        return 200 '{"status": "ok"}';
    }

    location /player/ {
        try_files $uri / /index.html;
        alias /opt/player/;
    }

    location /ui/ {
        try_files $uri / /index.html;
        alias /opt/lina/;
    }

    location /luna/ {
        try_files $uri / /index.html;
        alias /opt/luna/;
    }

    location /download/ {
        alias /opt/download/;
        try_files $uri @redirect_oss;
    }

    # Serve uploaded media (session replays, etc.) directly from the bind-mounted
    # data dir. The `^~` modifier is required because includes/core.conf has a
    # regex location `~ ^/(core|api|media)/` that would otherwise win and
    # proxy /media/* to Django (which doesn't serve media → 403). `^~` tells
    # nginx: if this prefix matches, don't try regexes. nginx natively serves
    # HTTP Range requests for static files, so the HTML5 video player can seek.
    location ^~ /media/ {
        alias /opt/jumpserver/data/media/;
        sendfile on;
        # koko writes SSH session replays as raw gzipped asciicast (.cast.gz).
        # The Luna asciinema-player fetches the URL and JSON.parses the body —
        # there is no client-side gunzip. Tell the browser the gz layer is a
        # transport encoding so it auto-decompresses before the player sees it.
        # Without this, the player crashes with `JSON.parse "\x1f\x8b…"`.
        #
        # NOTE: nested regex `location` blocks reset `alias` — the previous
        # revision re-declared `alias /opt/jumpserver/data/media/;` here which
        # (a) does nothing useful because nginx concatenates the ENTIRE URI to
        # a regex `alias`, and (b) trips nginx's "alias in regex → treat as
        # directory" fallback, returning 301→404. Drop the inner alias +
        # sendfile so the outer prefix `location`'s file serving is inherited;
        # this block only overrides response headers.
        location ~* \.cast\.gz$ {
            add_header Content-Encoding gzip always;
            add_header Content-Type "application/json; charset=utf-8" always;
            add_header Vary Accept-Encoding always;
        }
    }

    location @redirect_oss {
        rewrite ^/download/(.*)$ https://static.jumpserver.org/download/$1 permanent;
    }

    # Root — proxy to Django tenant selector instead of rewriting to /ui/
    location = / {
        proxy_pass http://core:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else → Lina
    location / {
        rewrite ^/(.*)$ /ui/$1 last;
    }

    include includes/*.conf;
}
